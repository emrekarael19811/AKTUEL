name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-key
          SUPABASE_ANON_KEY: placeholder-anon-key
          REDIS_URL: redis://localhost:6379/0
          ELASTICSEARCH_URL: http://localhost:9200
        run: pytest tests/ -v --tb=short -x

      - name: Linting
        run: |
          pip install ruff
          ruff check app/ --select E,W,F --ignore E501

  frontend-lint:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulum
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: TypeScript kontrol
        run: npm run type-check

      - name: ESLint
        run: npm run lint

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Backend Docker build
        run: docker build -t aktuel-api:ci ./backend
      - name: Frontend Docker build
        run: docker build -t aktuel-web:ci ./frontend/web
